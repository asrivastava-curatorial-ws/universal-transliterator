[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/text",
    "crates/transliteration",
    "crates/keyboards",
    "crates/rime-sys",
    "crates/rime-engine",
    "crates/kkc-sys",
    "crates/japanese-engine",
    "crates/export",
    "crates/storage",
    "crates/app",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
gtk = { package = "gtk4", version = "=0.8.1", features = ["v4_14"] }
glib = "=0.19.4"
gio = "=0.19.4"
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
unicode-normalization = "=0.1.22"
directories = "=5.0.1"
tempfile = "=3.9.0"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

