name: Release AppImage

# Push a tag such as v1.2.0 to build, test and publish the AppImage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo xargs -a packaging/ubuntu-build-deps.txt apt-get install -y --no-install-recommends

      - name: Use Ubuntu's Rust toolchain and crate sources
        run: |
          # The runner's rustup toolchain is newer; the project is built and
          # audited with Ubuntu 24.04's rustc and Debian crate sources.
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - name: Build, test and package
        env:
          MKSQUASHFS_PROCESSORS: "4"
        run: ./build_release.sh

      - name: Release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version { printing = 1; next }
            /^## / && printing { exit }
            printing { print }
          ' CHANGELOG.md > build/release-notes.md
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "chmod +x Universal-Transliterator-$VERSION-x86_64.AppImage"
            echo "./Universal-Transliterator-$VERSION-x86_64.AppImage"
            echo '```'
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } >> build/release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/Universal-Transliterator-"$VERSION"-x86_64.AppImage
                 dist/Universal-Transliterator-"$VERSION"-source.tar.zst
                 dist/Universal-Transliterator-"$VERSION".spdx.json
                 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Universal Transliterator $VERSION" \
              --notes-file build/release-notes.md
          fi
